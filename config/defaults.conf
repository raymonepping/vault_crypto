# config/defaults.conf — tracked defaults for image pins, host ports and names.
# scripts/compose.sh loads this file first and .env second, so any value can
# be overridden in .env without editing a compose file. scripts/common.sh,
# scripts/ports-check.sh and e2e/helpers/env.ts read the same names.

# ── Images ────────────────────────────────────────────────────────────────────
# vault-s runs Community (seal node only); vault-1 runs Enterprise 2.2 (the
# crypto features this lab demonstrates). Same release on both.
VAULT_IMAGE=docker.io/hashicorp/vault:2.2.1
VAULT_ENT_IMAGE=docker.io/hashicorp/vault-enterprise:2.2.1-ent
NODE_IMAGE=docker.io/library/node:24-alpine
NGINX_IMAGE=docker.io/library/nginx:1.30.0-alpine
# alpine 3.22+ ships OpenSSL 3.5, the first release that verifies ML-DSA X.509.
ALPINE_IMAGE=docker.io/library/alpine:3.24.1

# ── Host ports (all published on 127.0.0.1) ───────────────────────────────────
# Chosen to run beside vault_reference (8190-8212), secret_rotation (18190-18200),
# vault_goldie_locks (8220-8240), vault_portal (18500-18501, 13200-13201),
# vault_pki (18600-18601, 13300-13301) and key_rotation (18700-18701, 13400-13401).
VCRY_PORT_VAULT_S=18800
VCRY_PORT_VAULT_1=18801
VCRY_PORT_API=13500
VCRY_PORT_WEB=13501
VCRY_PORT_KEYCLOAK=13502

# ── Web TLS (rendered by tls-agent from pki-classic-int/issue/web) ────────────
# Classic ECDSA on purpose: browsers do not accept ML-DSA certificates yet.
VCRY_WEB_CN=crypto.localhost
VCRY_WEB_TTL=24h

# ── Application images (make app-build) ───────────────────────────────────────
VCRY_IMAGE_PREFIX=localhost/vault-crypto
VCRY_IMAGE_TAG=local

# ── Optional: public CA stand-in (make publicca-up) ───────────────────────────
PEBBLE_IMAGE=ghcr.io/letsencrypt/pebble:2.10.1
PEBBLE_CHALLTESTSRV_IMAGE=ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1

# ── Identity (make identity-up) ───────────────────────────────────────────────
OPENLDAP_IMAGE=docker.io/osixia/openldap:1.5.0
KEYCLOAK_IMAGE=docker.io/keycloak/keycloak:26.8.1
